schema_version: 1
name: Montevideo rental
stale_after_days: 45

# Hard filters use tri-state outcomes. Missing, unusable, disallowed inferred,
# or currency-mismatched values make eligibility indeterminate, never guessed.
hard_filters:
  - id: rental
    label: Offered for rent
    field: property.operation
    operator: equals
    value: rent
  - id: property-type
    label: Apartment or house
    field: property.property_type
    operator: one_of
    value: [apartment, house]
  - id: city
    label: Located in Montevideo
    field: property.location.city
    operator: equals
    value: Montevideo
    allow_inferred: true
  - id: maximum-price
    label: Monthly price at most USD 1600
    field: property.pricing.price
    operator: at_most
    value: 1600
    currency: USD

# Weights need not total 100. The score is earned weight / total configured
# weight; evidence coverage reports how much weighted data was actually known.
weighted_criteria:
  - id: preferred-neighborhood
    label: Preferred neighborhood
    field: property.location.neighborhood
    operator: one_of
    value: [Pocitos, Punta Carretas, Parque Rodó, Cordón]
    weight: 30
  - id: bedrooms
    label: At least two bedrooms
    field: property.features.bedrooms
    operator: at_least
    value: 2
    weight: 30
  - id: bathrooms
    label: At least one bathroom
    field: property.features.bathrooms
    operator: at_least
    value: 1
    weight: 15
  - id: area
    label: At least 60 square meters
    field: property.features.area_total_m2
    operator: at_least
    value: 60
    weight: 15
  - id: parking
    label: At least one parking space
    field: property.features.parking_spaces
    operator: at_least
    value: 1
    weight: 10

recommendation:
  # Discard only when known passes plus every unknown weight cannot reach this score.
  discard_below_score: 50
  visit_score: 60
  prioritize_score: 80
