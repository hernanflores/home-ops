name: Bug report
description: Report a reproducible problem in HomeOps.
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result. Remove private data first.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal synthetic fixture or steps.
    validations:
      required: true
